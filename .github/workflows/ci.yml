name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Heavy runtime deps (faster-whisper, piper-tts, sounddevice) are imported
        # lazily, so the test suite only needs the lightweight set below.
        run: |
          python -m pip install --upgrade pip
          pip install httpx python-dotenv pytest pytest-asyncio ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q
